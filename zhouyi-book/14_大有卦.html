<p>大有：元亨�?彖曰：大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨�?/p>
<p>象曰：火在天上，大有;君子以竭恶扬善，顺天休命�?/p>

<p>九二：大车以载，有攸往，无咎。象曰：大车以载，积中不败也�?/p>
<p>九三：公用亨于天子，小人弗克。象曰：公用亨于天子，小人害也。九四：匪其彭，无咎。象曰：匪其彭，无咎;明辨晰也�?/p>
<p>六五：厥孚交如，威如;吉。象曰：厥孚交如，信以发志也。威如之吉，易而无备也�?/p>
<p>上九：自天佑之，吉无不利。象曰：大有上吉，自天佑也�?/p>

<p><strong>火天大有卦为<a target="_blank">易经</a>六十四卦第十四卦，火天大有卦有哪些具体的象征意义？对人生有何种指导作用呢�?/strong></p>
<p>大有这一卦是异卦，由<a href="01_乾卦.html" target="_blank">乾卦</a>�?a href="30_离卦.html" target="_blank">离卦</a>组成，上卦为离，为火;下卦为乾，为天。火在天上，普照万物，万民归顺，顺天依时，大有所成�?/p>
<p>火天大有这一卦，从以下方面的含意而得其名：乾刚健，离光明，以刚健的行为，朝着光明的方向去奋斗，成功就大有希望，就会有所得。乾刚健，为内卦�?/p>
<p>说明美在内心;离光明，为外卦，说明体现在外部的手段光明磊落。具备这种表里一致的美德，才是真正的大有�?/p>
<p>火天大有卦位�?a href="13_同人�?html" target="_blank">同人�?/a>之后，《序卦》中这样解释道：“与人同者，物必归焉，故受之以大有。”寻找到志同道合的人，大家齐心协力做事，物产自然丰富起来，所以接下来就是大有了�?/p>
<p>《象》曰：火在天上，“大有�?君子以遏恶扬善，顺天休命�?/p>
<p>这句话的意思是说，大有卦的卦象是乾(�?下离(�?上，为火在天上之表象。火焰高悬于天上，象征太阳照耀万物，世界一片光明，农业大丰收，“大有收获”。“顺天休命”，“顺”就是服从的意�?“休”有顺其自然的意思�?/p>
<p>有道之士在“大有”的时候所作的事就是只需要顺服�?a target="_blank">天道</a>�?不必过多地操心自己的命运。君子在这个时候要阻止邪恶，颂扬一切善行，顺应天命，替天行道，以保护万物性命。所以一定要注意遏恶扬善，顺天休命�?/p>
<p>大有卦启示的是顺天依时的道理，属于上上卦。象征大有收获，象征富有，从一开始就顺达，昌隆通泰。在占卦时，大有卦属于上上卦，求官得官、求财得财，其间纵有反复，必如所愿。《象》是这样来断此卦：砍树摸雀作事牢，是非口舌自然消，<a target="_blank">婚姻</a>合伙来费力，若问走失未脱逃�?/p>
<p>大有卦的卦象是上卦为离为火，下卦为乾为天，火着到了天上便是大有卦的卦象。俗话说“众人拾柴火焰高”，大家围在一个火堆旁构成同人卦，可是众人聚在一起每个人给火堆添一把柴便可以让火焰烧到天上去，可见众人团结起来才会有更大的力量，才会有更大的收获。另外，离为日，乾为天，大有卦的卦象还有明日中天的形象。中午的太阳是最亮的，最热的，所以古代常以日中表示事物的鼎盛时期�?/p>
